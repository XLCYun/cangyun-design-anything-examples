name: Style submission

on:
  issues:
    types: [opened, edited]

permissions: {}

jobs:
  prepare-pr:
    if: github.event.issue.state == 'open' && startsWith(github.event.issue.title, '[风格投稿]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: style-submission-${{ github.event.issue.number }}
      cancel-in-progress: false
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      SUBMISSION_BRANCH: submissions/issue-${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Check for an existing submission
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SUBMISSION_BRANCH" \
            --state all --limit 1 --json url --jq '.[0].url // ""')
          printf 'existing_pr=%s\n' "$existing_pr" >> "$GITHUB_OUTPUT"
          if [[ -n "$existing_pr" ]]; then
            printf 'Existing PR %s\n' "$existing_pr" >> "$GITHUB_STEP_SUMMARY"
          else
            remote_ref=$(git ls-remote origin "refs/heads/$SUBMISSION_BRANCH")
            if [[ -z "$remote_ref" ]]; then
              echo "needs_branch=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Validate and commit the example
        if: steps.check.outputs.needs_branch == 'true'
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/style-submission"
          python="$RUNNER_TEMP/style-submission/bin/python"
          "$python" -m pip install --disable-pip-version-check jsonschema==4.26.0 Pillow==12.3.0
          example_dir=$("$python" scripts/prepare_submission.py "$GITHUB_EVENT_PATH")
          git switch -c "$SUBMISSION_BRANCH"
          git add -- "$example_dir"
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "Add style submission from issue #$ISSUE_NUMBER"
          git push origin "HEAD:refs/heads/$SUBMISSION_BRANCH"

      - name: Open the draft PR
        if: steps.check.outputs.existing_pr == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/style-submission-pr.md"
          printf '来自投稿 Issue #%s。\n\nCloses #%s\n' \
            "$ISSUE_NUMBER" "$ISSUE_NUMBER" > "$body"
          pr_url=$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" \
            --head "$SUBMISSION_BRANCH" --draft --title "收录风格示例 #$ISSUE_NUMBER" --body-file "$body")
          printf 'Draft PR %s\n' "$pr_url" >> "$GITHUB_STEP_SUMMARY"
